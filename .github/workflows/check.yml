name: Static firmware checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -v
