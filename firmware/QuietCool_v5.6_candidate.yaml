  - platform: template
    name: "Seconds Since Valid RF"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      if (!id(qc_last_valid_rx_ms)) return NAN;
      return (float)((millis() - id(qc_last_valid_rx_ms)) / 1000UL);
    web_server:
      sorting_group_id: qc_rf_health_group
      sorting_weight: 2

  - platform: template
    name: "WiFi Connects Since Boot"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 15s
    lambda: |-
      return (float)id(qc_wifi_connect_count);
    web_server:
      sorting_group_id: qc_wifi_history_group
      sorting_weight: 1

  - platform: template
    name: "WiFi Disconnects Since Boot"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 15s
    lambda: |-
      return (float)id(qc_wifi_disconnect_count);
    web_server:
      sorting_group_id: qc_wifi_history_group
      sorting_weight: 2

  - platform: debug
    free:
      id: qc_debug_free_heap
      name: "ESP32 Free Heap"
      entity_category: diagnostic
      web_server:
        sorting_group_id: qc_system_health_group
        sorting_weight: 1
    min_free:
      name: "ESP32 Minimum Free Heap"
      entity_category: diagnostic
      web_server:
        sorting_group_id: qc_system_health_group
        sorting_weight: 2
    block:
      name: "ESP32 Largest Free Block"
      entity_category: diagnostic
      web_server:
        sorting_group_id: qc_system_health_group
        sorting_weight: 3
    loop_time:
      id: qc_debug_loop_ms
      name: "ESP32 Maximum Loop Time"
      entity_category: diagnostic
      web_server:
        sorting_group_id: qc_system_health_group
        sorting_weight: 4

  - platform: wifi_signal
    id: wifi_signal_sensor
    name: "WiFi Signal"
    update_interval: 60s

    web_server:
      sorting_weight: 42

  # Actual channel of the AP the ESP32 is currently using.
  # Do not force a specific Wi-Fi channel in the wifi: configuration.
  - platform: template
    id: wifi_connected_channel
    name: "Connected Access Point Channel"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      if (!id(wifi_component).is_connected()) return NAN;
      return (float) id(wifi_component).get_wifi_channel();

    web_server:
      sorting_weight: 45

  - platform: uptime
    name: "Uptime"

    web_server:
      sorting_weight: 43


# ============================================================
# BUTTONS
# ============================================================

button:
  - platform: quietcool
    id: refresh_fan_button
    controller_id: quietcool_controller
    kind: refresh
    name: "Refresh Fan State"

    web_server:
      sorting_weight: 6

  - platform: quietcool
    id: quietcool_learn_internal
    controller_id: quietcool_controller
    kind: learn
    internal: true

  - platform: template
    id: learn_remote_button
    name: "Learn Remote ID"
    icon: "mdi:remote"

    web_server:
      sorting_weight: 4

    on_press:
      then:
        - lambda: |-
            std::string rid = "";

            if (id(remote_sender_id).has_state()) {
              rid = id(remote_sender_id).state;
            }

            if (rid.find("CB") != std::string::npos) {
              id(pairing_active) = false;
              id(pairing_result) = 3;
              id(pairing_result_started_ms) = millis();
            } else {
              id(pairing_active) = true;
              id(pairing_started_ms) = millis();
              id(pairing_result) = 0;
            }

        - if:
            condition:
              lambda: |-
                return id(pairing_active);

            then:
              - button.press: quietcool_learn_internal

  - platform: quietcool
    id: forget_remote_button
    controller_id: quietcool_controller
    kind: forget
    name: "Forget Remote ID"

    web_server:
      sorting_weight: 5

  # The visible web/HA Restart button still performs a normal reboot.
  # ESPHome buttons cannot detect browser press-and-hold/release events.
  - platform: restart
    name: "Restart QuietCool Controller"

    web_server:
      sorting_weight: 99

  # Tap once to start a 10s countdown on the OLED, tap again to cancel.
  # At 0 it will automatically factory-reset the device.
  - platform: template
    id: web_factory_reset_button
    name: "Factory Reset - 10 Second Countdown (Tap Again to Cancel)"
    icon: "mdi:restore-alert"
    web_server:
      sorting_weight: 98
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(web_reset_active);'
            then:
              - lambda: |-
                  id(web_reset_active) = false;
                  ESP_LOGI("quietcool.reset", "Web reset countdown CANCELLED");
              - component.update: oled_display
            else:
              - lambda: |-
                  id(web_reset_active) = true;
                  id(web_reset_started_ms) = millis();
                  ESP_LOGW("quietcool.reset", "Web factory-reset countdown STARTED (10s)");
              - switch.turn_on: oled_display_switch
              - component.update: oled_display

  # Only a completed web-UI countdown can trigger this internal action.
  - platform: factory_reset
    id: factory_reset_internal
    internal: true

  # Web-only recovery button: reuse the existing safe Refresh Fan State action.
  # Do not blindly repeat any previous ON/OFF/speed command.
  - platform: template
    name: "RF Recovery - Recheck Fan State"
    icon: "mdi:refresh"
    entity_category: diagnostic
    web_server:
      sorting_group_id: qc_rf_health_group
      sorting_weight: 6
    on_press:
      - button.press: refresh_fan_button


# ============================================================
# OLED FONTS
# ============================================================

font:
  - file: "gfonts://Roboto"
    id: oled_title
    size: 15

  - file: "gfonts://Roboto"
    id: oled_text
    size: 11

  - file: "gfonts://Roboto"
    id: oled_small
    size: 9


# ============================================================
# OLED DISPLAY
# ============================================================

display:
  - platform: ssd1306_i2c
    id: oled_display

    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 500ms

    lambda: |-
      const uint32_t now = millis();

      // Publish an OLED text mirror to ESPHome's EXISTING web interface.
      // Never republish identical values: keeps RAM/network/SSE traffic low.
      auto mirror = [&](const std::string &head,
                        const std::string &r1, const std::string &r2,
                        const std::string &r3, const std::string &r4,
                        const std::string &r5) {
        if (!id(oled_mirror_header).has_state() || id(oled_mirror_header).state != head)
          id(oled_mirror_header).publish_state(head);
        if (!id(oled_mirror_row_1).has_state() || id(oled_mirror_row_1).state != r1)
          id(oled_mirror_row_1).publish_state(r1);
        if (!id(oled_mirror_row_2).has_state() || id(oled_mirror_row_2).state != r2)
          id(oled_mirror_row_2).publish_state(r2);
        if (!id(oled_mirror_row_3).has_state() || id(oled_mirror_row_3).state != r3)
          id(oled_mirror_row_3).publish_state(r3);
        if (!id(oled_mirror_row_4).has_state() || id(oled_mirror_row_4).state != r4)
          id(oled_mirror_row_4).publish_state(r4);
        if (!id(oled_mirror_row_5).has_state() || id(oled_mirror_row_5).state != r5)
          id(oled_mirror_row_5).publish_state(r5);
      };

      // Use the same formatted strings for the physical OLED and web view.
      auto fmt = [](const char *format, auto... args) -> std::string {
        char output[128];
        snprintf(output, sizeof(output), format, args...);
        return std::string(output);
      };

      // Render and publish status regardless of the physical OLED power state.
      // SSD1306::turn_off() blanks the panel; its update lambda still runs,
      // allowing the main web UI mirror to keep rotating while the OLED is off.

      // ======================================================
      // FACTORY RESET: Web UI. Tap once to start, tap again to cancel.
      // ======================================================
      if (id(web_reset_active)) {
        const uint32_t elapsed = now - id(web_reset_started_ms);
        const uint32_t seconds_left = elapsed >= 10000UL
          ? 0U : (10000UL - elapsed + 999UL) / 1000UL;

        it.printf(64, 0, id(oled_title), TextAlign::TOP_CENTER, "QuietCool");
        it.printf(64, 17, id(oled_text), TextAlign::TOP_CENTER, "FACTORY RESET");
        it.printf(64, 29, id(oled_title), TextAlign::TOP_CENTER,
                  "%u", (unsigned) seconds_left);
        it.printf(64, 50, id(oled_small), TextAlign::TOP_CENTER,
                  seconds_left == 0 ? "RESETTING..." : "Tap again to CANCEL");
        mirror("QuietCool", "FACTORY RESET",
               fmt("%u seconds", (unsigned) seconds_left),
               seconds_left == 0 ? "RESETTING..." : "Tap again to CANCEL",
               "", "");
        return;
      }

      // ======================================================
      // PAIRING TIMEOUT
      // ======================================================

      if (
        id(pairing_active) &&
        (now - id(pairing_started_ms) >= 60000)
      ) {
        id(pairing_active) = false;
        id(pairing_result) = 2;
        id(pairing_result_started_ms) = now;
      }

      // ======================================================
      // PAIRING MODE
      // ======================================================

      if (id(pairing_active)) {

        uint32_t elapsed =
          (now - id(pairing_started_ms)) / 1000;

        uint32_t remaining =
          elapsed < 60 ? 60 - elapsed : 0;

        it.printf(
          64,
          0,
          id(oled_title),
          TextAlign::TOP_CENTER,
          "QuietCool"
        );

        it.printf(
          64,
          17,
          id(oled_title),
          TextAlign::TOP_CENTER,
          "PAIRING MODE"
        );

        it.printf(
          64,
          35,
          id(oled_small),
          TextAlign::TOP_CENTER,
          "Press Fan Remote"
        );

        it.printf(
          64,
          45,
          id(oled_small),
          TextAlign::TOP_CENTER,
          "3 Times - 1 sec apart"
        );

        it.printf(
          64,
          55,
          id(oled_small),
          TextAlign::TOP_CENTER,
          "%u seconds left",
          (unsigned) remaining
        );

        mirror("QuietCool", "PAIRING MODE", "Press Fan Remote",
               "3 Times - 1 sec apart",
               fmt("%u seconds left", (unsigned) remaining), "");
        return;
      }

      // ======================================================
      // PAIRING SUCCESS
      // ======================================================

      if (
        id(pairing_result) == 1 &&
        now - id(pairing_result_started_ms) < 5000
      ) {

        it.printf(
          64,
          0,
          id(oled_title),
          TextAlign::TOP_CENTER,
          "QuietCool"
        );

        it.printf(
          64,
          20,
          id(oled_title),
          TextAlign::TOP_CENTER,
          "LEARNED"
        );

        it.printf(
          64,
          38,
          id(oled_text),
          TextAlign::TOP_CENTER,
          "ID SAVED"
        );

        if (id(remote_sender_id).has_state()) {
          it.printf(
            64,
            52,
            id(oled_small),
            TextAlign::TOP_CENTER,
            "%s",
            id(remote_sender_id).state.c_str()
          );
        }

        mirror("QuietCool", "LEARNED", "ID SAVED",
               id(remote_sender_id).has_state() ? id(remote_sender_id).state : "",
               "", "");
        return;
      }

      // ======================================================
      // PAIRING FAILED
      // ======================================================

      if (
        id(pairing_result) == 2 &&
        now - id(pairing_result_started_ms) < 5000
      ) {

        it.printf(
          64,
          0,
          id(oled_title),
          TextAlign::TOP_CENTER,
          "QuietCool"
        );

        it.printf(
          64,
          22,
          id(oled_title),
          TextAlign::TOP_CENTER,
          "PAIRING FAILED"
        );

        it.printf(
          64,
          45,
          id(oled_text),
          TextAlign::TOP_CENTER,
          "Try Again"
        );

        mirror("QuietCool", "PAIRING FAILED", "Try Again", "", "", "");
        return;
      }

      // ======================================================
      // ALREADY PAIRED
      // ======================================================

      if (
        id(pairing_result) == 3 &&
        now - id(pairing_result_started_ms) < 5000
      ) {

        it.printf(
          64,
          0,
          id(oled_title),
          TextAlign::TOP_CENTER,
          "QuietCool"
        );

        it.printf(
          64,
          22,
          id(oled_title),
          TextAlign::TOP_CENTER,
          "ALREADY PAIRED"
        );

        it.printf(
          64,
          45,
          id(oled_text),
          TextAlign::TOP_CENTER,
          "Forget First"
        );

        mirror("QuietCool", "ALREADY PAIRED", "Forget First", "", "", "");
        return;
      }

      // ======================================================
      // FALLBACK WIFI SETUP MODE
      // ======================================================

      if (
        !id(wifi_component).is_connected() &&
        (now - id(boot_time_ms) >= 30000)
      ) {

        it.printf(
          64,
          0,
          id(oled_title),
          TextAlign::TOP_CENTER,
          "QuietCool"
        );

        it.printf(
          64,
          16,
          id(oled_title),
          TextAlign::TOP_CENTER,
          "SETUP MODE"
        );

        it.printf(
          64,
          34,
          id(oled_small),
          TextAlign::TOP_CENTER,
          "SSID: QuietCool Fallback"
        );

        it.printf(
          64,
          44,
          id(oled_small),
          TextAlign::TOP_CENTER,
          "P/W: quietcool"
        );

        it.printf(
          64,
          54,
          id(oled_small),
          TextAlign::TOP_CENTER,
          "Open: 192.168.4.1"
        );

        mirror("QuietCool", "SETUP MODE", "SSID: QuietCool Fallback",
               "P/W: quietcool", "Open: 192.168.4.1", "");
        return;
      }

      // ======================================================
      // DIAGNOSTIC OLED PAGES: each row is drawn AND mirrored verbatim.
      // v5.4: duration is selectable in the WEB UI; no extra OLED rows.
      // OLED and web mirror continue to share the same page-selection logic.
      const auto rotate_choice = id(qc_oled_rotate_interval).current_option();
      const uint32_t rotate_ms = rotate_choice == "5 seconds" ? 5000UL
        : rotate_choice == "15 seconds" ? 15000UL
        : rotate_choice == "30 seconds" ? 30000UL : 10000UL;
      uint8_t page = (now / rotate_ms) % 4U;
      if (!id(oled_auto_rotate).state) {
        const auto choice = id(oled_manual_page).current_option();
        if      (choice == "RF Diagnostics") page = 1;
        else if (choice == "Network")        page = 2;
        else if (choice == "Command Status") page = 3;
        else                                 page = 0;
      }

      const bool state_known = id(fan_state_known).has_state() && id(fan_state_known).state;
      const bool wifi_up = id(wifi_component).is_connected();
      const char *fault = !id(controller_fault).has_state() ? "Unknown"
                        : id(controller_fault).state ? "ACTIVE" : "None";
      const char *status = id(command_status).has_state()
                         ? id(command_status).state.c_str() : "N/A";
      const char *evidence = id(evidence_source).has_state()
                           ? id(evidence_source).state.c_str() : "N/A";

      std::string head, r1, r2, r3, r4, r5;
      if (page == 0) {
        head = "QuietCool";
        if (!state_known) r1 = "Fan: Unknown";
        else if (!id(whole_house_fan).state) r1 = "Fan: OFF";
        else r1 = fmt("Fan: ON  Speed: %d", (int)id(whole_house_fan).speed);

        r2 = id(timer_remaining_min).has_state()
          ? fmt("Timer left: %.0f min", id(timer_remaining_min).state)
          : "Timer left: Unknown";
        r3 = wifi_up ? "WiFi: Connected" : "WiFi: Connecting";
        if (id(rx_frame_count) > 0 && now - id(last_rx_ms) < 750UL)
          r4 = "RF: Receiving";
        else if (id(last_tx_ms) > 0 && now - id(last_tx_ms) < 750UL)
          r4 = "RF: Transmitting";
        else r4 = "RF: Ready";
        r5 = fmt("Status: %.17s", status);
      } else if (page == 1) {
        head = "RF Diagnostics";
        r1 = id(rf_tx_count).has_state() && id(rf_rx_valid_count).has_state()
           ? fmt("TX: %.0f   RX OK: %.0f", id(rf_tx_count).state, id(rf_rx_valid_count).state)
           : "TX / RX OK: N/A";
        r2 = id(rf_rx_rejected_count).has_state()
           ? fmt("RX rejected: %.0f", id(rf_rx_rejected_count).state)
           : "RX rejected: N/A";
        r3 = id(rx_frame_count) > 0
           ? fmt("Last RF: %lus ago", (unsigned long)((now - id(last_rx_ms)) / 1000UL))
           : "Last RF: None yet";
        r4 = fmt("Cmd: %.20s", status);
        r5 = fmt("Fault: %s", fault);
      } else if (page == 2) {
        head = "Network";
        const char *ssid = wifi_up && id(wifi_ssid_connected).has_state()
                         ? id(wifi_ssid_connected).state.c_str() : "Not connected";
        const char *ip = wifi_up && id(wifi_ip).has_state()
                       ? id(wifi_ip).state.c_str() : "N/A";
        const char *bssid = wifi_up && id(wifi_connected_bssid).has_state()
                            ? id(wifi_connected_bssid).state.c_str() : "N/A";
        r1 = fmt("SSID: %.19s", ssid);
        // MAC identifies the exact connected AP; the full value is also
        // available in the web UI, even if a long line clips on the OLED.
        r2 = fmt("AP: %.17s", bssid);
        r3 = fmt("IP: %.21s", ip);
        if (wifi_up) {
          const int channel = (int) id(wifi_component).get_wifi_channel();
          r4 = id(wifi_signal_sensor).has_state()
             ? fmt("RSSI:%.0f CH:%d", id(wifi_signal_sensor).state, channel)
             : fmt("WiFi: N/A  CH: %d", channel);
        } else {
          r4 = "WiFi: offline";
        }
        // API-client status also includes log viewers; not exclusively HA.
        const bool paired = id(remote_sender_id).has_state() &&
          id(remote_sender_id).state.find("CB") != std::string::npos;
        r5 = fmt("API:%s  REM:%s", id(quietcool_api).is_connected() ? "ON" : "OFF",
                 paired ? "YES" : "NO");
      } else {
        head = "Fan Command";
        const char *last_cmd = id(last_tx_command_text).has_state()
                             ? id(last_tx_command_text).state.c_str() : "N/A";
        const char *confirmed = id(last_confirmed_state_text).has_state()
                              ? id(last_confirmed_state_text).state.c_str() : "N/A";
        r1 = fmt("Last TX: %.17s", last_cmd);
        r2 = fmt("Status: %.17s", status);
        r3 = fmt("Evidence: %.16s", evidence);
        r4 = fmt("Confirmed: %.15s", confirmed);
        r5 = fmt("Fault: %s", fault);
      }

      // All six strings are the same ones drawn to the physical OLED.
      mirror(fmt("%s  %u/4", head.c_str(), (unsigned)(page + 1)),
             r1, r2, r3, r4, r5);
      it.print(0, 0, id(oled_text), head.c_str());
      it.printf(127, 2, id(oled_small), TextAlign::TOP_RIGHT,
                "%u/4", (unsigned)(page + 1));
      it.line(0, 14, 127, 14);
      it.print(0, 15, id(oled_small), r1.c_str());
      it.print(0, 25, id(oled_small), r2.c_str());
      it.print(0, 35, id(oled_small), r3.c_str());
      it.print(0, 45, id(oled_small), r4.c_str());
      it.print(0, 55, id(oled_small), r5.c_str());


# ============================================================
# SWITCHES
# ============================================================

switch:

  # Four diagnostic OLED pages rotate every 10 seconds when enabled.
  # Turn OFF to hold the page chosen by "OLED Page".
  - platform: template
    id: oled_auto_rotate
    name: "OLED Auto Rotate"
    icon: "mdi:monitor-dashboard"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: qc_oled_settings_group
      sorting_weight: 1

  # OLED
  - platform: template
    name: "OLED Display"
    id: oled_display_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

    web_server:
      sorting_weight: 7

    turn_on_action:
      - lambda: |-
          id(oled_display).turn_on();
      - component.update: oled_display

    turn_off_action:
      - lambda: |-
          // Only blank the physical OLED. The web mirror stays live.
          id(oled_display).turn_off();


  # Green onboard LED
  - platform: gpio
    pin: GPIO25
    id: board_led
    name: "Board LED"
    icon: "mdi:led-on"
    restore_mode: ALWAYS_OFF

    web_server:
      sorting_weight: 8


# ============================================================
# WIFI LED STATUS
#
# WiFi disconnected:
#   Green LED blinks.
#
# WiFi connected:
#   Automation stops touching the LED.
#   HA / Web UI has full manual control.
# ============================================================

interval:
  # Web reset countdown. Hold the OLED at 0 for ~1 second so it is visible.
  - interval: 200ms
    then:
      - if:
          condition:
            lambda: |-
              return id(web_reset_active) &&
                     (uint32_t)(millis() - id(web_reset_started_ms)) >= 11000UL;
          then:
            - lambda: |-
                ESP_LOGW("quietcool.reset", "Web countdown finished: factory reset");
                id(web_reset_active) = false;
            - button.press: factory_reset_internal

  - interval: 500ms
    then:
      - if:
          condition:
            lambda: |-
              return !id(wifi_component).is_connected();

          then:
            - switch.toggle: board_led
